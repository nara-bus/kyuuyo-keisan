<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>給与計算</title>
<meta name="theme-color" content="#1E6F5C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F0E4C8;
    --surface: #FFFFFF;
    --text: #1F2A28;
    --text-muted: #5C6B67;
    --accent: #1E6F5C;
    --accent-soft: #DCEEE8;
    --warn: #A9711F;
    --warn-soft: #F3E7D4;
    --danger: #B3402C;
    --danger-soft: #F5DFD9;
    --border: #DCE3E0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 440px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  header.app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  header.app-header h1 {
    font-size: 23px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .header-actions {
    display: flex;
    gap: 8px;
  }
  .header-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: var(--accent);
    color: #eafaf4;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 9px;
    padding: 5px 8px;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    font-weight: 700;
    box-shadow: 0 2px 0 rgba(0,0,0,.15);
    min-width: 44px;
    white-space: nowrap;
  }
  .header-btn svg {
    width: 16px;
    height: 16px;
  }
  .header-btn:active { background: #17594A; box-shadow: 0 1px 0 rgba(0,0,0,.1); }

  .install-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 14px;
  }
  .install-bar span {
    font-size: 13px;
    color: var(--text);
  }
  .install-btn {
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }

  .year-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 16px;
  }
  .year-nav button {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--accent);
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .year-nav button:active { background: var(--accent-soft); }
  .year-nav .year-label {
    font-size: 20px;
    font-weight: 700;
    min-width: 108px;
    text-align: center;
  }

  .hero {
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 22px 20px 20px;
    margin-bottom: 16px;
  }
  .hero .row-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 2px;
  }
  .hero .total {
    font-family: 'Shippori Mincho', serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.2;
    letter-spacing: 0.01em;
  }
  .hero .total .unit { font-size: 16px; margin-left: 2px; }
  .hero .limit-line {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .hero .limit-line button.edit-limit {
    border: none;
    background: none;
    color: var(--accent);
    font-size: 12px;
    text-decoration: underline;
    padding: 0;
    cursor: pointer;
  }
  .limit-edit-row {
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .limit-edit-row.open { display: flex; }
  .limit-edit-row input {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }
  .limit-edit-row button.save-limit {
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }

  .progress-track {
    height: 8px;
    border-radius: 5px;
    background: var(--accent-soft);
    margin: 14px 0 10px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 5px;
    transition: width 0.25s ease, background 0.25s ease;
  }
  .progress-fill.warn { background: var(--warn); }
  .progress-fill.danger { background: var(--danger); }

  .status-line {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
  }
  .status-line.warn { color: var(--warn); }
  .status-line.danger { color: var(--danger); }
  .status-line .sub-note {
    font-weight: 400;
    color: var(--text-muted);
    font-size: 14px;
    margin-left: 6px;
  }

  .months-card {
    background: var(--surface);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .month-row {
    display: flex;
    align-items: center;
    padding: 5px 16px;
    border-bottom: 1px solid var(--border);
  }
  .month-row:last-child { border-bottom: none; }
  .month-row .m-label {
    width: 50px;
    font-size: 18px;
    font-weight: 500;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .month-row .m-input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .month-row input.m-input {
    flex: 1;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 22px;
    color: var(--text);
    text-align: right;
    padding: 6px 2px;
    min-width: 0;
  }
  .month-row input.m-input:focus {
    outline: none;
    background: var(--accent-soft);
    border-radius: 6px;
  }
  .month-row .yen-suffix {
    font-size: 16px;
    color: var(--text-muted);
  }
  .month-row.this-month { background: var(--accent-soft); }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 18px;
    line-height: 1.6;
  }

  .reset-row {
    text-align: center;
    margin-top: 10px;
  }
  .reset-row button {
    border: none;
    background: none;
    color: var(--text-muted);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14201D;
      --surface: #1B2926;
      --text: #EDF3F1;
      --text-muted: #8FA39D;
      --accent: #57C5A6;
      --accent-soft: #204137;
      --warn: #E0AC5E;
      --warn-soft: #3A2E1A;
      --danger: #E07A64;
      --danger-soft: #3D2420;
      --border: #2B3B37;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14201D;
    --surface: #1B2926;
    --text: #EDF3F1;
    --text-muted: #8FA39D;
    --accent: #57C5A6;
    --accent-soft: #204137;
    --warn: #E0AC5E;
    --warn-soft: #3A2E1A;
    --danger: #E07A64;
    --danger-soft: #3D2420;
    --border: #2B3B37;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <h1>給与計算</h1>
    <div class="header-actions">
      <button class="header-btn" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        保存
      </button>
      <button class="header-btn" id="importBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        読込
      </button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </header>

  <div class="install-bar" id="pwaInstallBar">
    <span>📲 ホーム画面に追加できます</span>
    <button class="install-btn" id="installBtn">追加</button>
  </div>

  <div class="year-nav">
    <button id="prevYear" aria-label="前の年">◀</button>
    <div class="year-label" id="yearLabel">2026年</div>
    <button id="nextYear" aria-label="次の年">▶</button>
  </div>

  <div class="hero">
    <div class="row-label">今年の合計</div>
    <div class="total"><span id="totalAmount">0</span><span class="unit">円</span></div>
    <div class="limit-line">
      上限 <span id="limitDisplay">1,300,000</span>円
      <button class="edit-limit" id="editLimitBtn">変更</button>
    </div>
    <div class="limit-edit-row" id="limitEditRow">
      <input type="text" inputmode="numeric" id="limitInput" placeholder="1300000">
      <button class="save-limit" id="saveLimitBtn">保存</button>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="status-line" id="statusLine">残り 1,300,000円</div>
  </div>

  <div class="months-card" id="monthsCard"></div>

  <div class="reset-row">
    <button id="resetYearBtn">この年のデータをリセット</button>
  </div>

  <div class="footer-note">入力内容はこの端末に自動で保存されます。</div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'haigusha130man-data-v1';
  var DEFAULT_LIMIT = 1300000;

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : { years: {} };
    } catch (e) {
      return { years: {} };
    }
  }
  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { /* ignore */ }
  }

  var data = loadData();
  var currentYear = new Date().getFullYear();

  function getYearData(year) {
    var key = String(year);
    if (!data.years[key]) {
      data.years[key] = { limit: DEFAULT_LIMIT, months: new Array(12).fill(null) };
    }
    return data.years[key];
  }

  function fmt(n) {
    return Math.round(n).toLocaleString('ja-JP');
  }

  var yearLabel = document.getElementById('yearLabel');
  var totalAmount = document.getElementById('totalAmount');
  var limitDisplay = document.getElementById('limitDisplay');
  var progressFill = document.getElementById('progressFill');
  var statusLine = document.getElementById('statusLine');
  var monthsCard = document.getElementById('monthsCard');
  var limitEditRow = document.getElementById('limitEditRow');
  var limitInput = document.getElementById('limitInput');

  var todayYear = new Date().getFullYear();
  var todayMonth = new Date().getMonth() + 1;

  function buildMonthRows() {
    monthsCard.innerHTML = '';
    for (var i = 0; i < 12; i++) {
      var m = i + 1;
      var row = document.createElement('div');
      row.className = 'month-row';
      if (currentYear === todayYear && m === todayMonth) {
        row.className += ' this-month';
      }
      row.innerHTML =
        '<div class="m-label">' + m + '月</div>' +
        '<div class="m-input-wrap">' +
          '<input class="m-input" type="text" inputmode="numeric" placeholder="0" data-month="' + i + '">' +
          '<span class="yen-suffix">円</span>' +
        '</div>';
      monthsCard.appendChild(row);
    }
  }

  function render() {
    var yd = getYearData(currentYear);
    yearLabel.textContent = currentYear + '年';
    limitDisplay.textContent = fmt(yd.limit);
    limitInput.value = yd.limit;

    buildMonthRows();
    var inputs = monthsCard.querySelectorAll('.m-input');
    inputs.forEach(function (inp) {
      var idx = Number(inp.getAttribute('data-month'));
      var v = yd.months[idx];
      inp.value = (v === null || v === undefined) ? '' : fmt(v);
      inp.addEventListener('input', onMonthInput);
      inp.addEventListener('blur', function () { updateSummary(); });
    });

    updateSummary();
  }

  function onMonthInput(e) {
    var inp = e.target;
    var idx = Number(inp.getAttribute('data-month'));
    var digits = inp.value.replace(/[^0-9]/g, '');
    var yd = getYearData(currentYear);
    if (digits === '') {
      yd.months[idx] = null;
      inp.value = '';
    } else {
      var num = parseInt(digits, 10);
      yd.months[idx] = num;
      inp.value = fmt(num);
      var caretPos = inp.value.length;
      inp.setSelectionRange(caretPos, caretPos);
    }
    saveData();
    updateSummary();
  }

  function updateSummary() {
    var yd = getYearData(currentYear);
    var total = yd.months.reduce(function (sum, v) { return sum + (v || 0); }, 0);
    var remaining = yd.limit - total;
    var ratio = yd.limit > 0 ? total / yd.limit : 0;

    totalAmount.textContent = fmt(total);

    progressFill.style.width = Math.min(100, Math.max(0, ratio * 100)) + '%';
    progressFill.classList.remove('warn', 'danger');
    statusLine.classList.remove('warn', 'danger');

    if (remaining < 0) {
      progressFill.classList.add('danger');
      statusLine.classList.add('danger');
      statusLine.innerHTML = fmt(Math.abs(remaining)) + '円 オーバー';
    } else if (ratio >= 0.9) {
      progressFill.classList.add('warn');
      statusLine.classList.add('warn');
      statusLine.innerHTML = '残り ' + fmt(remaining) + '円';
    } else {
      statusLine.innerHTML = '残り ' + fmt(remaining) + '円';
    }
  }

  document.getElementById('prevYear').addEventListener('click', function () {
    currentYear -= 1;
    render();
  });
  document.getElementById('nextYear').addEventListener('click', function () {
    currentYear += 1;
    render();
  });

  document.getElementById('editLimitBtn').addEventListener('click', function () {
    limitEditRow.classList.toggle('open');
    if (limitEditRow.classList.contains('open')) {
      limitInput.focus();
    }
  });
  document.getElementById('saveLimitBtn').addEventListener('click', function () {
    var digits = limitInput.value.replace(/[^0-9]/g, '');
    var yd = getYearData(currentYear);
    yd.limit = digits === '' ? DEFAULT_LIMIT : parseInt(digits, 10);
    saveData();
    limitEditRow.classList.remove('open');
    render();
  });

  document.getElementById('exportBtn').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var now = new Date();
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var fname = 'syunyu-kanri-' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '.json';
    var a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('importBtn').addEventListener('click', function () {
    document.getElementById('importFile').click();
  });

  document.getElementById('importFile').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var parsed;
      try {
        parsed = JSON.parse(ev.target.result);
      } catch (err) {
        alert('このファイル、読み込めへんかったわ（形式が違うみたいや）');
        return;
      }
      if (!parsed || typeof parsed !== 'object' || !parsed.years) {
        alert('このファイル、読み込めへんかったわ（形式が違うみたいや）');
        return;
      }
      if (!confirm('今のデータを上書きしてもええか？')) return;
      data = parsed;
      saveData();
      render();
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('resetYearBtn').addEventListener('click', function () {
    if (!confirm(currentYear + '年のデータを消してもええか？')) return;
    data.years[String(currentYear)] = { limit: DEFAULT_LIMIT, months: new Array(12).fill(null) };
    saveData();
    render();
  });

  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* ignore */ });
    });
  }

  // --- ホーム画面に追加の案内 ---
  var installPromptEvent = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installPromptEvent = e;
    document.getElementById('pwaInstallBar').style.display = 'flex';
  });
  window.addEventListener('appinstalled', function () {
    document.getElementById('pwaInstallBar').style.display = 'none';
    installPromptEvent = null;
  });
  document.getElementById('installBtn').addEventListener('click', function () {
    if (!installPromptEvent) return;
    installPromptEvent.prompt();
    installPromptEvent.userChoice.then(function () {
      installPromptEvent = null;
    });
  });
})();
</script>
</body>
</html>
